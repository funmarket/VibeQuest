name: Foundation checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
# Database/browser suites are documented local gates. This workflow has not run
# remotely; no repository or cloud resource was provisioned in Foundation-001.
